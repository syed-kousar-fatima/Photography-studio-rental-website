<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | FrameSpace</title>
  <link rel="icon" href="./logo.jpg" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --font-display: 'Playfair Display', 'Georgia', serif;
  --brand-primary:#C8973A;
  --bg-body:#f8fafc;
  --bg-card:#ffffff;
  --text-primary:#1e293b;
  --text-muted:#94a3b8;
  --border-color:#e2e8f0;
  --input-bg:#f1f5f9;
  --error-red: #ef4444;

}
  

[data-theme="dark"] {
  --bg-body:#0f172a;
  --bg-card:#1e293b;
  --text-primary:#f1f5f9;
  --text-muted:#64748b;
  --border-color:#334155;
  --input-bg:#0f172a;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}

body{
  background:var(--bg-body);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}


.top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
  z-index:999;
}
.ctrl-btn{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid var(--border-color);
  background:var(--bg-card);
  cursor:pointer;
  color: var(--text-primary);
}


.auth-card{
  width:100%;
  max-width:420px;
  background:var(--bg-card);
  padding:2rem;
  border-radius:20px;
  border:1px solid var(--border-color);
}
.logo-box {
  display: flex;
  align-items: center;
  justify-content:center;
  gap:8px;
  margin-bottom:1rem;
}

.logo-link {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}

.logo-img {
  width: 36px;   /* adjust as needed */
  height: 36px;
  object-fit: cover;
  border-radius: 6px;
}


.logo-text {
  font-family: var(--font-display);
  font-size: clamp(1rem, 2vw, 1.2rem);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.logo-accent {
  color: var(--brand-primary);
   font-family: var(--font-display);
   font-size: clamp(1rem, 2vw, 1.2rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.header{
  text-align:center;
  margin-bottom:1.5rem;
}
.header h2{margin-bottom:5px; color: var(--text-primary);font-weight: 700; font-size: 18px;padding-left: 2.5rem;}
.header p{color:var(--text-muted);font-size:13px;padding-left: 2.5rem;}

.form-group{margin-bottom:1rem; color: var(--text-primary);}
        
input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border-color);
  background:var(--input-bg);
}


.pass-wrap{position:relative;}
.eye{
  position:absolute;
  right:10px;
  top:10px;
  cursor:pointer;
}
.row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:1rem;
  color: var(--text-primary);
}

.btn{
  width:100%;
  padding:10px;
  background:var(--brand-primary);
  color:#fff;
  border:none;
  border-radius:10px;
}

.social{
  display:flex;
  gap:10px;
  margin-top:1rem;
}
.social button{
  flex:1;
  padding:8px;
  border:1px solid var(--border-color);
  border-radius:10px;
}
.social i{
  color: #C8973A;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal.active{display:flex;}

.modal-card{
  background:var(--bg-card);
  padding:2rem;
  border-radius:16px;
  width:90%;
  max-width:350px;
}
label{
  display: flex;
}
.sign-up{
text-decoration: none;
color: var(--brand-primary);
}
#forgot{
  text-decoration: none;
  color: var(--error-red);
}

@media(max-width:320px){
  .auth-card{
    height:100vh;
    border-radius:0;
    padding:1.2rem;
  }
  .social{flex-direction:column;}
}

@media(max-width:360px){
  .auth-card{padding:1.5rem;}
}

@media(min-width:768px){
  .auth-card{max-width:400px;}
}

@media(min-width:1024px){
  .auth-card{max-width:420px;}
}

</style>
</head>

<body>

<!-- GLOBAL CONTROLS -->
<div class="top-controls">
  <button class="ctrl-btn" id="rtlBtn"><i class="fa-solid fa-left-right"></i></button>
  <button class="ctrl-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
</div>

<!-- LOGIN CARD -->
<div class="auth-card">
  <div class="logo-box">
  <a href="index.html" class="logo-link">
    <img src="./logo.jpg" alt="FrameSpace Studio Logo" class="logo-img">
    <span class="logo-text">
      FrameSpace<span class="logo-accent">Studio</span>
    </span>
  </a>
</div>

  <div class="header">
    <h2>Welcome Back</h2>
    <p>Login to your account</p>
  </div>

  <form id="form">

    <div class="form-group">
      <input type="email" id="email" placeholder="Enter Your Email">
    </div>

    <div class="form-group pass-wrap">
      <input type="password" id="pass" placeholder="Enter Your Password">
      <span class="eye" id="eye">👁</span>
    </div>

    <div class="row">
      <label><input type="checkbox"> Remember </label>
      <a href="#" id="forgot">Forgot Password?</a>
    </div>

    <button class="btn">Login</button>

  </form>

  <div class="social">
    <button><i class="fab fa-google"></i> Google</button>
    <button><i class="fab fa-apple"></i> Apple</button>
  </div>

  <p style="text-align:center;margin-top:10px;color: var(--text-primary);">
    New user? <a href="./register.html" id="openModal" class="sign-up">Sign up</a>
  </p>

</div>


<script>

// DARK MODE
document.getElementById("themeBtn").onclick=()=>{
  let t=document.documentElement;
  t.dataset.theme=t.dataset.theme==="dark"?"light":"dark";
}

// RTL
document.getElementById("rtlBtn").onclick=()=>{
  let d=document.documentElement;
  d.dir=d.dir==="rtl"?"ltr":"rtl";
}

// PASSWORD
eye.onclick=()=>{
  pass.type=pass.type==="password"?"text":"password";
}

// MODAL
openModal.onclick=()=>modal.classList.add("active");
modal.onclick=(e)=>{
  if(e.target.id==="modal") modal.classList.remove("active");
}

</script>

</body>
</html>
