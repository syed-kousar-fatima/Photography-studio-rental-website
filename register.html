<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FrameSpace Studio</title>
    <link rel="icon" href="./logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #C8973A;
            --brand-glow: rgba(37, 99, 235, 0.15);
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --error-red: #ef4444;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
     --font-display: 'Playfair Display', 'Georgia', serif;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        [dir="rtl"] .top-actions {
            left: 1.5rem;
            right: auto;
        }

        [dir="rtl"] .eye-icon {
            left: 1rem;
            right: auto;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body,
        html {
           min-height: 100vh;
            overflow: hidden;
            background-color: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

       .auth-card{

    width:100%;

    max-width:460px;

    padding:2.5rem;

    border-radius:24px;

    background:var(--bg-card);

    border:1px solid var(--border-color);

    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

 .top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
  z-index:999;
}
.ctrl-btn{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid var(--border-color);
  background:var(--bg-card);
  cursor:pointer;
  color: var(--text-primary);
}


        .top-actions {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover {
            color: var(--brand-primary);
            border-color: var(--brand-primary);
        }
.logo-box{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:1.5rem;
}

.logo-link{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
}

.logo-img{
    width:52px;
    height:52px;
    border-radius:10px;
    object-fit:cover;
}

.logo-text,
.logo-accent{
    font-family:var(--font-display);
    font-size:1.6rem;
    font-weight:700;
    letter-spacing:-0.02em;
}

.logo-text{
    color:var(--text-primary);
}

.logo-accent{
    color:var(--brand-primary);
}
        .header-content {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header-content h1 {
    
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            font-weight: 700; font-size: 18px;
            padding-left: 0.8rem;
        }

        .header-content p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding-left: 0.8rem;
        }
.form-group{
    margin-bottom:1rem;
}

.form-group label{
    display:block;
    margin-bottom:.45rem;
    font-size:.85rem;
    font-weight:600;
    color:var(--text-primary);
}

.form-input,
input{
    width:100%;
    height:52px;
    padding:0 16px;
    border-radius:12px;
    border:1px solid var(--border-color);
    background:var(--input-bg);
    color:var(--text-primary);
    font-size:.95rem;
    outline:none;
    transition:.3s;
}

.form-input:focus,
input:focus{

    border-color:var(--brand-primary);

    box-shadow:0 0 0 4px rgba(200,151,58,.15);
}
       

        .input-container {
            position: relative;
            width: 100%;
        }

        

        .eye-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .form-group.error .form-input {
            border-color: var(--error-red);
        }

        .error-text {
            color: var(--error-red);
            font-size: 0.7rem;
            margin-top: 0.25rem;
            display: none;
        }

        .form-group.error .error-text {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            background: var(--brand-primary);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.25rem 0;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin: 0 1rem;
        }


        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.7rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-social:hover {
            background: var(--input-bg);
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
        }
        
/* .auth-card {
    width: 100%;
    max-width: 560px;
    padding: 2.5rem;
    border-radius: 20px;
} */

/* First Name + Last Name Row */
.form-row{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;
}
/* .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
} */

.form-row .form-group {
    margin-bottom: 0.85rem;
}
@media (max-width:1024px){

.auth-card{

max-width:450px;

padding:2.2rem;
}

.logo-img{

width:48px;
height:48px;
}

.logo-text,
.logo-accent{

font-size:1.45rem;
}

}
@media (max-width:768px){

.auth-card{

max-width:420px;

padding:2rem;
}

.form-row{

grid-template-columns:1fr;
gap:0;
}

.logo-img{

width:46px;
height:46px;
}

.logo-text,
.logo-accent{

font-size:1.35rem;
}

}
@media (max-width:480px){

.auth-card{

max-width:100%;

margin:20px;

padding:1.5rem;
}

.logo-img{

width:42px;
height:42px;
}

.logo-text,
.logo-accent{

font-size:1.2rem;
}

.form-input,
input{

height:48px;
font-size:.9rem;
}

.btn,
.btn-submit{

height:48px;
}

}
@media (max-width:320px){

body{

align-items:flex-start;
}

.auth-card{

border-radius:0;

min-height:100vh;

padding:1.2rem;

margin:0;
}

.logo-img{

width:38px;
height:38px;
}

.logo-text,
.logo-accent{

font-size:1.05rem;
}

.social,
.social-grid{

grid-template-columns:1fr;
display:grid;
}

.form-input,
input{

height:46px;
padding:0 14px;
}

}
@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .auth-card {
        max-width: 420px;
    }
}
      

        @media (max-width: 768px) {
            .auth-card {
                max-width: 400px;
                padding: 2rem;
            }
        }

        @media (max-width: 320px) {
            body {
                align-items: flex-start;
            }

            .auth-card {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 1rem;
                border: none;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }

            .header-content h1 {
                font-size: 1.2rem;
            }

            .form-group {
                margin-bottom: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="top-controls">
        <button class="ctrl-btn" id="rtlBtn"><i class="fa-solid fa-left-right"></i></button>
        <button class="ctrl-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
    </div>
    <main class="auth-card">
        <div class="logo-box">
            <a href="index.html" class="logo-link">
                <img src="./logo.jpg" alt="FrameSpace Studio Logo" class="logo-img">
                <span class="logo-text">
                    FrameSpace<span class="logo-accent">Studio</span>
                </span>
            </a>
        </div>

        <div class="header-content">
            <h1>Create Account</h1>
            <p>Join our community of cinematic artists</p>
        </div>

        <form id="signupForm" novalidate>
        

                <div class="form-group">
                    <label for="firstName">Full Name</label>
                    <input type="text" id="firstName" class="form-input" placeholder="Enter your FullName" required>
                    <span class="error-text">First name is required.</span>
                </div>

                <!-- <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" class="form-input" placeholder="Enter your LastName" required>
                    <span class="error-text">Last name is required.</span>
                </div> -->

            

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                <span class="error-text">Please enter a valid email.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" required
                        minlength="8">
                    <i class="fas fa-eye eye-icon" id="togglePassword"></i>
                </div>
                <span class="error-text">Must be at least 8 characters.</span>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="divider">Or join with</div>

        <div class="social-grid">
            <button class="btn-social">
                <i class="fab fa-google" style="color: var(--brand-primary);"></i> Google
            </button>
            <button class="btn-social">
                <i class="fab fa-apple" style="color: var(--brand-primary);"></i> Apple
            </button>
        </div>

        <div class="login-footer">
            Already have an account? <a href="./loginRegister.html">Sign In</a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.getElementById('signupForm');
            const themeToggle = document.getElementById('themeToggle');
            const rtlToggle = document.getElementById('rtlToggle');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');



            // DARK MODE
            document.getElementById("themeBtn").onclick = () => {
                let t = document.documentElement;
                t.dataset.theme = t.dataset.theme === "dark" ? "light" : "dark";
            }

            // RTL
            document.getElementById("rtlBtn").onclick = () => {
                let d = document.documentElement;
                d.dir = d.dir === "rtl" ? "ltr" : "rtl";
            }

            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.classList.toggle('fa-eye-slash');
            });


            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;

                const inputs = signupForm.querySelectorAll('input[required]');
                inputs.forEach(input => {
                    const group = input.closest('.form-group');
                    if (!input.value || (input.type === 'email' && !input.value.includes('@'))) {
                        group.classList.add('error');
                        isValid = false;
                    } else {
                        group.classList.remove('error');
                    }
                });

                if (isValid) {
                    const btn = signupForm.querySelector('.btn-submit');
                    btn.innerText = "Creating...";
                    setTimeout(() => {
                        alert('Registration Successful!');
                        btn.innerText = "Create Account";
                    }, 1500);
                }
            });


            document.querySelectorAll('.form-input').forEach(input => {
                input.addEventListener('input', () => {
                    input.closest('.form-group').classList.remove('error');
                });
            });
        });
    </script>

</body>

</html>
